name: Daily Health Check

"on":
  schedule:
    # 매일 00:00 UTC = 한국시간(KST) 09:00
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run production health check
        run: node scripts/prod-health-check.mjs

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = `일일 점검 실패 — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '자동 일일 점검(GitHub Actions)에서 문제가 발견되었습니다.',
              '테스트 또는 운영 헬스체크 중 하나 이상이 실패했습니다. 아래 로그를 확인하세요.',
              '',
              `실행 로그: ${process.env.RUN_URL}`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'daily-check',
            });
            const alreadyOpen = existing.some((issue) => issue.title === title);
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['daily-check'],
              });
            }
